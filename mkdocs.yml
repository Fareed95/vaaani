site_name: Vaaani
site_description: Voice-enabled multilingual RAG for Indian languages
repo_url: https://github.com/your-org/vaaani
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Chunking Strategies: chunking-strategies.md
  - Guardrails: guardrails.md
  - Latency Benchmarks: latency-benchmarks.md
  - Setup: setup.md
  - API Reference: api-reference.md
  - Decisions: decisions.md
